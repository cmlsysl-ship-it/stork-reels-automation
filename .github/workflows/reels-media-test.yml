name: Generate STORK Reels test video

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reels-media-test.yml'

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate real H.264 MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "color=c=white:s=540x960:r=25:d=8" \
            -f lavfi -i "anullsrc=channel_layout=stereo:sample_rate=44100" \
            -vf "drawbox=x=0:y=0:w=iw:h=190:color=0xf26a21:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='STORK':fontcolor=white:fontsize=72:x=(w-text_w)/2:y=59,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='GITHUB TO BUFFER':fontcolor=black:fontsize=30:x=(w-text_w)/2:y=330,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='REELS MP4 TEST':fontcolor=black:fontsize=34:x=(w-text_w)/2:y=395,drawbox=x=0:y=820:w=iw:h=140:color=0xf26a21:t=fill" \
            -t 8 -c:v libx264 -preset veryfast -crf 26 \
            -pix_fmt yuv420p -c:a aac -b:a 64k \
            -movflags +faststart media/stork-reels-transfer-test.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height -of default=noprint_wrappers=1 media/stork-reels-transfer-test.mp4
          test -s media/stork-reels-transfer-test.mp4
          sha256sum media/stork-reels-transfer-test.mp4
      - name: Commit generated public video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/stork-reels-transfer-test.mp4
          if git diff --staged --quiet; then
            echo "Video already current"
          else
            git commit -m "Add generated STORK Reels test MP4"
            git push
          fi
